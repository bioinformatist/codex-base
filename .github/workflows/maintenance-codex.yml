name: Maintain Codex Release

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */4 * * *"

permissions:
  contents: read

concurrency:
  group: maintenance-codex
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      MAINTENANCE_BRANCH: maint/codex
    steps:
      - name: Require maintenance credential
        env:
          MAINTENANCE_PAT: ${{ secrets.MAINTENANCE_PAT }}
        shell: bash
        run: |
          if [[ -z "$MAINTENANCE_PAT" ]]; then
            echo "MAINTENANCE_PAT is required for Codex release maintenance." >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.MAINTENANCE_PAT }}

      - uses: DeterminateSystems/nix-installer-action@v17

      - name: Update Codex release pins
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: scripts/update-codex-release

      - name: Detect changes
        id: changes
        shell: bash
        run: |
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Close stale pull request and branch
        if: steps.changes.outputs.changed == 'false'
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          while IFS= read -r number; do
            [[ -n "$number" ]] || continue
            gh pr close "$number" --repo "$GITHUB_REPOSITORY" --comment "Closing because the pinned Codex release is current."
          done < <(
            gh pr list \
              --repo "$GITHUB_REPOSITORY" \
              --state open \
              --base main \
              --head "$MAINTENANCE_BRANCH" \
              --json number \
              --jq '.[].number'
          )

          if git ls-remote --exit-code --heads origin "refs/heads/$MAINTENANCE_BRANCH" >/dev/null 2>&1; then
            git push origin --delete "$MAINTENANCE_BRANCH"
          fi

      - name: Verify update
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          nix run .#sync-vendored-skills -- --check
          nix flake check --allow-import-from-derivation

      - name: Create or update maintenance pull request
        id: cpr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1
        with:
          token: ${{ secrets.MAINTENANCE_PAT }}
          add-paths: |
            README.md
            README.zh-CN.md
            flake.nix
            flake.lock
            nix/packages.nix
          commit-message: "chore(maint): update codex"
          author: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          committer: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          branch: maint/codex
          base: main
          title: "chore(maint): update codex"
          body: "Update Codex, Code Mode Host, the matching source lock, and release documentation."

      - name: Ready and auto squash maintenance pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.MAINTENANCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail

          pr_number="${{ steps.cpr.outputs.pull-request-number }}"
          [[ -n "$pr_number" ]] || { echo "create-pull-request did not return a PR number" >&2; exit 1; }

          if [[ "$(gh pr view "$pr_number" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" == true ]]; then
            gh pr ready "$pr_number" --repo "$GITHUB_REPOSITORY"
          fi
          gh pr merge "$pr_number" --repo "$GITHUB_REPOSITORY" --auto --squash
