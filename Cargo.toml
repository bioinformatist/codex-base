[workspace]
members = ["src/improve", "src/config-merge"]
resolver = "2"

[workspace.package]
version = "0.19.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
nix = { version = "0.31", features = ["fs", "signal", "process", "poll", "user"] }
tempfile = "3"
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
toml_edit = "=0.25.17"
