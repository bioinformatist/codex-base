<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img">
<title>Improve workflow</title><desc>Small tasks can be edited directly; planned work proceeds through authorization, isolated execution, verification, independent review and checkpoint. Integration and external acceptance are separate.</desc>
<defs><style>.bg{fill:#f8fafc}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.conditional{fill:#fffbeb;stroke:#d97706;stroke-width:2}.end{fill:#ecfdf5;stroke:#059669;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.title{font:700 26px system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 19px system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.small{font:16px system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs>
<rect class="bg" width="1200" height="620" rx="24"/><text class="title" x="40" y="52">Improve workflow</text>
<rect class="box" x="40" y="90" width="225" height="75" rx="12"/><text class="label" x="152.5" y="133.5" text-anchor="middle">Small, clear task</text>
<path class="line" d="M265 127H310"/>
<rect class="end" x="315" y="90" width="225" height="75" rx="12"/><text class="label" x="427.5" y="133.5" text-anchor="middle">Edit directly</text>
<text class="small" x="40" y="205">When a reviewed plan is needed / planning and review also consume usage</text>
<rect class="box" x="40" y="250" width="130" height="115" rx="12"/><text class="label" x="105.0" y="301.5" text-anchor="middle">Clarify and</text><text class="label" x="105.0" y="325.5" text-anchor="middle">check facts</text>
<path class="line" d="M170 307H200"/>
<rect class="box" x="205" y="250" width="130" height="115" rx="12"/><text class="label" x="270.0" y="301.5" text-anchor="middle">Review</text><text class="label" x="270.0" y="325.5" text-anchor="middle">the plan</text>
<path class="line" d="M335 307H365"/>
<rect class="box" x="370" y="250" width="130" height="115" rx="12"/><text class="label" x="435.0" y="313.5" text-anchor="middle">Authorize</text>
<path class="line" d="M500 307H530"/>
<rect class="box" x="535" y="250" width="130" height="115" rx="12"/><text class="label" x="600.0" y="289.5" text-anchor="middle">Execute in</text><text class="label" x="600.0" y="313.5" text-anchor="middle">isolation</text><text class="label" x="600.0" y="337.5" text-anchor="middle">① Execution</text>
<path class="line" d="M665 307H695"/>
<rect class="box" x="700" y="250" width="130" height="115" rx="12"/><text class="label" x="765.0" y="289.5" text-anchor="middle">Verify and</text><text class="label" x="765.0" y="313.5" text-anchor="middle">simplify</text><text class="label" x="765.0" y="337.5" text-anchor="middle">② Checks</text>
<path class="line" d="M830 307H860"/>
<rect class="box" x="865" y="250" width="130" height="115" rx="12"/><text class="label" x="930.0" y="301.5" text-anchor="middle">Independent</text><text class="label" x="930.0" y="325.5" text-anchor="middle">review</text>
<path class="line" d="M995 307H1025"/>
<rect class="end" x="1030" y="250" width="130" height="115" rx="12"/><text class="label" x="1095.0" y="313.5" text-anchor="middle">Checkpoint</text>
<text class="small" x="40" y="435">Integration and external acceptance require separate authorization and evidence.</text>
<text class="small" x="40" y="470">Direct editing suits small tasks; usage savings are not guaranteed.</text>
</svg>
