<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img">
<title>② Verification</title><desc>Necessary tests, per-step simplification, and independent review form the main path. Visual and Bend paths may both apply; neither replaces independent review.</desc>
<defs><style>.bg{fill:#f8fafc}.box{fill:#eff6ff;stroke:#2563eb;stroke-width:2}.conditional{fill:#fffbeb;stroke:#d97706;stroke-width:2}.end{fill:#ecfdf5;stroke:#059669;stroke-width:2}.line{fill:none;stroke:#475569;stroke-width:2.5;marker-end:url(#arrow)}.title{font:700 26px system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.label{font:600 19px system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#0f172a}.small{font:16px system-ui,-apple-system,"Segoe UI","Noto Sans CJK SC","Microsoft YaHei",sans-serif;fill:#334155}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0l10 5-10 5z" fill="#475569"/></marker></defs>
<rect class="bg" width="1200" height="620" rx="24"/><text class="title" x="40" y="52">② Verification</text>
<rect class="box" x="40" y="100" width="250" height="85" rx="12"/><text class="label" x="165.0" y="136.5" text-anchor="middle">Necessary</text><text class="label" x="165.0" y="160.5" text-anchor="middle">tests</text>
<path class="line" d="M290 142H325"/>
<rect class="box" x="330" y="100" width="250" height="85" rx="12"/><text class="label" x="455.0" y="136.5" text-anchor="middle">Verify and</text><text class="label" x="455.0" y="160.5" text-anchor="middle">simplify</text>
<path class="line" d="M580 142H615"/>
<rect class="box" x="620" y="100" width="250" height="85" rx="12"/><text class="label" x="745.0" y="136.5" text-anchor="middle">Independent</text><text class="label" x="745.0" y="160.5" text-anchor="middle">review</text>
<path class="line" d="M870 142H905"/>
<rect class="end" x="910" y="100" width="250" height="85" rx="12"/><text class="label" x="1035.0" y="148.5" text-anchor="middle">Checkpoint</text>
<rect class="conditional" x="40" y="245" width="530" height="145" rx="12"/><text class="label" x="305.0" y="287.5" text-anchor="middle">Visual: when original analysis is needed</text><text class="label" x="305.0" y="311.5" text-anchor="middle">Input: original and collection evidence</text><text class="label" x="305.0" y="335.5" text-anchor="middle">Output: observations, locations, uncertainty</text><text class="label" x="305.0" y="359.5" text-anchor="middle">Returns to implementation and review</text><text class="small" x="305.0" y="379" text-anchor="middle">Does not collect screenshots</text>
<rect class="conditional" x="630" y="245" width="530" height="145" rx="12"/><text class="label" x="895.0" y="287.5" text-anchor="middle">Bend: selected proof for actual Bend code</text><text class="label" x="895.0" y="311.5" text-anchor="middle">Input: implementation and selected properties</text><text class="label" x="895.0" y="335.5" text-anchor="middle">Output: proof evidence and coverage limits</text><text class="label" x="895.0" y="359.5" text-anchor="middle">Returns to review; not proof of other languages or runtimes</text>
<path class="line" d="M305 245V205H745V190"/>
<path class="line" d="M895 245V205H745V190"/>
<text class="small" x="40" y="455">Both paths can apply; neither replaces independent review.</text>
<text class="small" x="40" y="490">Bend and Lean are not installed automatically; code is not migrated to demonstrate proofs.</text>
</svg>
